# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/src/IdentityServices/ClientApp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/src/IdentityServices"
    schedule:
      interval: "weekly"
    ignore:
      # The meshmakers/* platform images are bumped deliberately with the platform toolchain;
      # Dependabot misreads their legacy tag scheme (8.0-<date> sorts above 1.3.0.0).
      - dependency-name: "meshmakers/*"
