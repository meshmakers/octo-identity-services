$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.Identity-2.14.0

# CLIENTS — the full attribute set is large; every property the imperative seed set
# explicitly is mirrored here. Attributes not configured by the seed (claims, custom
# prefixes, CIBA settings) get the IdentityServer default the engine derives from the
# CK model defaults.
# 
# OctoTool / octo-cli (660…31).
# Part of the System.Identity.Bootstrap blueprint — see blueprint.yaml for the full file list.
entities:

  # --------------------------------------------------------------------------
  # 660…31 — OctoTool / octo-cli (device-code flow + RFC 8693 token exchange, no PKCE, no client secret)
  # --------------------------------------------------------------------------
  - rtId: '660000000000000000000031'
    ckTypeId: System.Identity/Client
    rtWellKnownName: OctoToolClient
    attributes:
      - id: System/Enabled
        value: true
      - id: System.Identity/ClientId
        value: octo-cli
      - id: System.Identity/ProtocolType
        value: oidc
      - id: System.Identity/RequireClientSecret
        value: false
      - id: System.Identity/Secrets
        value: []
      - id: System.Identity/AllowedGrantTypes
        value:
          - urn:ietf:params:oauth:grant-type:device_code
          # AB#6839: RFC 8693 Token Exchange — lets the CLI exchange the operator's
          # home-tenant (root) token for a child-tenant token (acr_values=tenant:X) instead of
          # sending the root token to a foreign tenant route. The exchange never grants
          # authority: the issued token carries only the roles of an explicit mapping, group
          # or direct role in the child tenant (ProvisionCurrentUser -ttid X); an operator
          # without any is refused (access_denied, tenant_not_provisioned). No refresh token.
          - urn:ietf:params:oauth:grant-type:token-exchange
      - id: System.Identity/RequirePkce
        value: false
      - id: System.Identity/AllowOfflineAccess
        value: true
      - id: System.Identity/AllowedScopes
        value:
          - openid
          - profile
          - email
          - role
          - octo_api
      - id: System.Identity/RedirectUris
        value: []
      - id: System.Identity/PostLogoutRedirectUris
        value: []
      - id: System.Identity/AllowedCorsOrigins
        value: []
      - id: System.Identity/AutoProvisionInChildTenants
        value: true
