$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.Identity-2.14.0

# The API scopes: the three platform scopes (660…14 – 660…16) and the LLM gateway scope (660…17).
# Part of the System.Identity.Bootstrap blueprint — see blueprint.yaml for the full file list.
entities:

  # ===========================================================================
  # API SCOPES (660…14 – 660…16) — names match
  # CommonConstants.OctoApi{FullAccess,ReadOnly,DataModelManagement}.
  # The child-tenant write-through path does NOT seed
  # octo_api.data_model_management — that scope is system-tenant-only. Phase 3
  # ships the full set in every tenant for parity; admins who restrict it for
  # a child tenant disable it on the entity (Enabled=false) afterwards.
  # ===========================================================================

  - rtId: '660000000000000000000014'
    ckTypeId: System.Identity/ApiScope
    rtWellKnownName: octo_api
    attributes:
      - id: System/Enabled
        value: true
      - id: System/Name
        value: octo_api
      - id: System/DisplayName
        value: Full access to all Octo platform APIs
      - id: System.Identity/ResourceClaims
        value: []
      - id: System.Identity/ShowInDiscoveryDocument
        value: true
      - id: System.Identity/IsRequired
        value: false
      - id: System.Identity/IsEmphasized
        value: false

  - rtId: '660000000000000000000015'
    ckTypeId: System.Identity/ApiScope
    rtWellKnownName: octo_api.read_only
    attributes:
      - id: System/Enabled
        value: true
      - id: System/Name
        value: octo_api.read_only
      - id: System/DisplayName
        value: Read-only access to all Octo platform APIs
      - id: System.Identity/ResourceClaims
        value: []
      - id: System.Identity/ShowInDiscoveryDocument
        value: true
      - id: System.Identity/IsRequired
        value: false
      - id: System.Identity/IsEmphasized
        value: false

  - rtId: '660000000000000000000016'
    ckTypeId: System.Identity/ApiScope
    rtWellKnownName: octo_api.data_model_management
    attributes:
      - id: System/Enabled
        value: true
      - id: System/Name
        value: octo_api.data_model_management
      - id: System/DisplayName
        value: Manage construction kit data models
      - id: System.Identity/ResourceClaims
        value: []
      - id: System.Identity/ShowInDiscoveryDocument
        value: true
      - id: System.Identity/IsRequired
        value: false
      - id: System.Identity/IsEmphasized
        value: false

  # ===========================================================================
  # LLM GATEWAY SCOPE (660…17) — the AI service's central-key LLM
  # gateway (POST /llm/anthropic/v1/messages, octo-ai-services
  # docs/llm-gateway.md) requires it (LlmGatewayConstants.InvokeScope).
  # Attached to octoAPI (api-resources.yaml), the audience the AI service
  # validates. Machine-only: no client of this blueprint allows it, so no user
  # login and no interactive client can obtain it. Only the clients that call
  # the gateway hold it: the pipeline service accounts (`octo-pipeline-sa-*`,
  # Communication Controller) and the AI service's client-credentials client
  # (`octo-ai-adapter`). The scope alone opens nothing: the gateway also needs
  # the tenant's KeySource=CentralKey, a monthly cap and the central key.
  # Not advertised in the discovery document.
  # ===========================================================================

  - rtId: '660000000000000000000017'
    ckTypeId: System.Identity/ApiScope
    rtWellKnownName: ai.llm.invoke
    attributes:
      - id: System/Enabled
        value: true
      - id: System/Name
        value: ai.llm.invoke
      - id: System/DisplayName
        value: Call the central-key LLM gateway of the AI service
      - id: System.Identity/ResourceClaims
        value: []
      - id: System.Identity/ShowInDiscoveryDocument
        value: false
      - id: System.Identity/IsRequired
        value: false
      - id: System.Identity/IsEmphasized
        value: false
