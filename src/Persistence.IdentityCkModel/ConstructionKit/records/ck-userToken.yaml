"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
records:
  - recordId: UserToken
    derivable: Any
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/LoginProvider
        name: LoginProvider
      - id: ${System}/Name
        name: Name
      - id: ${this}/UserId
        name: UserId
      # AB#7766: holds the authenticator key and the recovery codes in clear text. Secret as an assignment
      # override (the Value attribute definition is shared), so a copy of this record never leaves the tenant.
      - id: ${this}/Value
        name: Value
        isOptional: true
        ownership: Secret