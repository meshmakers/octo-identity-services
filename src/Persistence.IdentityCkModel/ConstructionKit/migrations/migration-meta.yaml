$schema: https://schemas.meshmakers.cloud/ck-migration-meta.schema.json
# AB#8157 - 2.x -> 3.0.1 is a model-only major (AB#8053: identity-owned User attributes become access MethodOnly, CreateUser-1 gets
# replacesGenericCreate; no ids, types, defaults or stored values change). The CK engine refuses a schema-only bridge across a major
# (CkMigrationMajorVersionGuard, AB#4924 G3), so 3.0.0 - which shipped without an entry - stopped every tenant upgrade. One entry per
# 2.x minor from 2.9.0 on points at the same empty script (steps: []). Tenants below 2.9.0 take the 2.8.0 -> 2.9.0 data migration first
# (the chain 2.8.0 -> 2.9.0 -> 3.0.1). Whoever publishes another System.Identity 2.x on a release line must extend this list.
ckModelId: System.Identity-3.0.1
migrations:
  - fromVersion: "2.8.0"
    toVersion: "2.9.0"
    scriptPath: 2.8.0-to-2.9.0.yaml
    description: "Lift Client URI list attributes from StringArray to RecordArray<ClientUriEntry> (AB#4209 Step 1)"
    breaking: false
  - fromVersion: "2.9.0"
    toVersion: "3.0.1"
    scriptPath: 2.x-to-3.0.1.yaml
    description: "System.Identity 3.x: identity-owned User attributes access MethodOnly, CreateUser-1 replacesGenericCreate; no data migration - entry point for 2.9.0"
    breaking: true
