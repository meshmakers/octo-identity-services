"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: DataPolicy
    derivable: Any
    description: Binds a DataPermission to CK types with actions, scope and enforcement mode. A CK type is protected as soon as any policy targets it (AB#4972).
    derivedFromCkTypeId: ${System}/Entity
    writeAccess:
      channels: [ System.Identity/IdentityService ]
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/TargetCkTypeIds
        name: TargetCkTypeIds

      - id: ${this}/PolicyActions
        name: Actions

      - id: ${this}/PolicyScope
        name: Scope

      - id: ${this}/PolicyEnforcementMode
        name: EnforcementMode

      # AB#6384: seed-owned opt-in for the blueprint-lock write restriction (see the attribute).
      - id: ${this}/ProtectBlueprintLocked
        name: ProtectBlueprintLocked
    associations:
      - id: ${this}/PolicyPermission
        targetCkTypeId: ${this}/DataPermission
    # 3.4.0: the REST PUT dataPermissions/policies/{policyRtId}/enforcementMode becomes a facade of this method.
    # Roles follow the REST parity (DataPermissionsController: IdentityUserAdministrationWritePolicy = UserManagement). The
    # enforcement mode changes data visibility tenant-wide: the audit names the policy, the old and the new mode.
    methods:
      - methodId: SetEnforcementMode-1
        description: "Switches the policy between Enforce and AuditOnly (the operator flip after the audit review). Setting the mode the policy already has changes nothing."
        parameters:
          - { name: enforcementMode, valueType: Enum, valueCkEnumId: "${this}/DataPolicyEnforcementMode" }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
        execution:
          timeoutSeconds: 30
          idempotent: true
      # 3.8.0: REST DELETE dataPermissions/policies/{policyRtId} becomes a facade of this method (UserManagement).
      - methodId: DeleteDataPolicy-1
        description: "Deletes the policy. Its CK types are no longer protected by it."
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
