"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: ApiResource
    derivable: Any
    derivedFromCkTypeId: ${this}/Resource
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/RequireResourceIndicator
        name: RequireResourceIndicator
      # AB#6443 (audit AB#6317 re-scan): credential hashes (introspection secrets), so `Secret`, like
      # Client.Secrets (AB#6329): kept on a blueprint re-apply, left out of an ExportRt. The
      # System.Identity.Bootstrap seed writes this attribute (empty) on both seeded API resources, so it
      # was seed-owned in effect: only the generic blanking guard kept a stored secret, and a seed with a
      # non-empty placeholder would have overwritten it. A fresh tenant still gets the seed value.
      - id: ${this}/Secrets
        name: ApiSecrets
        ownership: Secret
      - id: ${this}/Scopes
        name: Scopes
      - id: ${this}/AllowedAccessTokenSigningAlgorithms
        name: AllowedAccessTokenSigningAlgorithms
    # 3.4.0: the secret methods of the API resource (introspection secrets). The REST secret write endpoints of
    # ApiSecretsController (POST/PUT apiSecrets/apiResource/{name}, POST .../delete, legacy DELETE .../{secretValue}) are their
    # facades. Roles as Client.AddSecret-1 (REST IdentitySecretAdministrationPolicy, staged by SecretManagementRoleEnforcement
    # in the handler). The generated secret and the secret value are sensitive: the handlers are offered on the bus only with
    # Methods:Identity:EnablePasswordMethods=true and run local only (REST facade) otherwise.
    methods:
      - methodId: AddSecret-1
        description: "Generates a new secret for the API resource. The generated value is the result and is shown exactly once; only its hash is stored."
        parameters:
          - { name: description, valueType: String, isOptional: true, description: "Free text shown in the list of secrets." }
          - { name: expirationDate, valueType: DateTime, isOptional: true, description: "Expiration of the secret; without it the secret does not expire." }
        result:
          valueType: String
          sensitive: true
        errors:
          - { code: CONCURRENT_CHANGE, description: "The secrets of the API resource were changed concurrently by other requests; retry." }
        authorization:
          roles: [ TenantManagement, UserManagement, SecretManagement ]
          dataAccess: Write
      - methodId: RemoveSecret-1
        description: "Removes a secret of the API resource, identified by its stored value (as the list of secrets shows it) or its clear text."
        parameters:
          - { name: secretValue, valueType: String, sensitive: true, description: "The stored value (or the clear text) of the secret that is removed." }
        errors:
          - { code: SECRET_NOT_FOUND, description: "The API resource has no secret with this value." }
          - { code: CONCURRENT_CHANGE, description: "The secrets of the API resource were changed concurrently by other requests; retry." }
        authorization:
          roles: [ TenantManagement, UserManagement, SecretManagement ]
          dataAccess: Write
        execution:
          timeoutSeconds: 30
      - methodId: UpdateSecret-1
        description: "Replaces the description and the expiration date of a secret of the API resource, identified by its stored value or its clear text. The secret value itself never changes; an omitted description or expiration date is cleared."
        parameters:
          - { name: secretValue, valueType: String, sensitive: true, description: "The stored value (or the clear text) of the secret that is updated." }
          - { name: description, valueType: String, isOptional: true, description: "Free text shown in the list of secrets; omitted clears it." }
          - { name: expirationDate, valueType: DateTime, isOptional: true, description: "Expiration of the secret; omitted means the secret does not expire." }
        errors:
          - { code: SECRET_NOT_FOUND, description: "The API resource has no secret with this value." }
          - { code: CONCURRENT_CHANGE, description: "The secrets of the API resource were changed concurrently by other requests; retry." }
        authorization:
          roles: [ TenantManagement, UserManagement, SecretManagement ]
          dataAccess: Write
        execution:
          timeoutSeconds: 30
          idempotent: true
      # 3.7.0: create, update and delete run as methods (REST parity: ApiResourcesController POST/PUT/DELETE,
      # IdentityTenantAdministrationWritePolicy). The secrets are not parameters: they change only through the secret methods.
      # No replacesGenericCreate (Major on this type, row M16; writeAccess refuses the generic create).
      - methodId: CreateApiResource-1
        kind: Static
        description: "Creates an API resource without secrets. The result is the rtId of the new resource."
        parameters:
          - { name: name, valueType: String }
          - { name: displayName, valueType: String, isOptional: true }
          - { name: description, valueType: String, isOptional: true }
          - { name: enabled, valueType: Boolean, isOptional: true, description: "Omitted is false, as in the REST body." }
          - { name: showInDiscoveryDocument, valueType: Boolean, isOptional: true, description: "Omitted is false, as in the REST body." }
          - { name: requireResourceIndicator, valueType: Boolean, isOptional: true, description: "Omitted is false." }
          - { name: userClaims, valueType: StringArray, isOptional: true, description: "Omitted leaves the user claims unchanged (empty on create)." }
          - { name: scopes, valueType: StringArray, isOptional: true, description: "Omitted leaves the scopes unchanged (empty on create)." }
          - { name: allowedAccessTokenSigningAlgorithms, valueType: StringArray, isOptional: true, description: "Omitted is the server default (empty)." }
        result:
          valueType: String
        errors:
          - { code: API_RESOURCE_ALREADY_EXISTS, description: "An API resource with this name exists." }
        authorization:
          roles: [ TenantManagement, UserManagement ]
          dataAccess: Write
      - methodId: UpdateApiResource-1
        description: "Replaces the definition of the API resource, as the REST PUT does; its secrets stay."
        parameters:
          - { name: name, valueType: String }
          - { name: displayName, valueType: String, isOptional: true }
          - { name: description, valueType: String, isOptional: true }
          - { name: enabled, valueType: Boolean, isOptional: true, description: "Omitted is false, as in the REST body." }
          - { name: showInDiscoveryDocument, valueType: Boolean, isOptional: true, description: "Omitted is false, as in the REST body." }
          - { name: requireResourceIndicator, valueType: Boolean, isOptional: true, description: "Omitted is false." }
          - { name: userClaims, valueType: StringArray, isOptional: true, description: "Omitted leaves the user claims unchanged (empty on create)." }
          - { name: scopes, valueType: StringArray, isOptional: true, description: "Omitted leaves the scopes unchanged (empty on create)." }
          - { name: allowedAccessTokenSigningAlgorithms, valueType: StringArray, isOptional: true, description: "Omitted is the server default (empty)." }
        errors:
          - { code: API_RESOURCE_ALREADY_EXISTS, description: "Another API resource has this name." }
          - { code: CONCURRENT_CHANGE, description: "The API resource was changed concurrently by other requests; retry." }
        authorization:
          roles: [ TenantManagement, UserManagement ]
          dataAccess: Write
      - methodId: DeleteApiResource-1
        description: "Deletes the API resource with its secrets."
        authorization:
          roles: [ TenantManagement, UserManagement ]
          dataAccess: Write
