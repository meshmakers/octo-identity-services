"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: DataPermission
    derivable: Any
    description: Named data permission (dot-namespaced), granted to roles via GrantsPermission; DataPolicies bind it to CK types (AB#4972).
    derivedFromCkTypeId: ${System}/Entity
    writeAccess:
      channels: [ System.Identity/IdentityService ]
    isFinal: true
    isAbstract: false
    displayNameRule: "${PermissionId}"
    attributes:
      - id: ${this}/PermissionId
        name: PermissionId

      - id: ${System}/Description
        name: Description
        isOptional: true
    # AB#7773 (Feature AB#5696, F4.2): the method declarations of the data permission; the handlers follow with AB#7779.
    # Declarations only: until a handler is registered the gateway answers METHOD_HANDLER_NOT_AVAILABLE.
    # Roles follow the REST parity (DataPermissionsController: IdentityUserAdministrationWritePolicy = UserManagement).
    # No replacesGenericCreate: the System.Identity.Bootstrap blueprint seeds data permissions (AB#7121 would refuse the tenant setup).
    methods:
      - methodId: GrantToRole-1
        description: "Grants the permission to a role."
        parameters:
          - { name: roleName, valueType: String }
        errors:
          - { code: ROLE_NOT_FOUND, description: "The role does not exist." }
          - { code: PERMISSION_ALREADY_GRANTED, description: "The role already holds the permission." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: RevokeFromRole-1
        description: "Revokes the permission from a role."
        parameters:
          - { name: roleName, valueType: String }
        errors:
          - { code: ROLE_NOT_FOUND, description: "The role does not exist." }
          - { code: PERMISSION_NOT_GRANTED, description: "The role does not hold the permission." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      # 3.8.0: create and delete of the permission and the create of its policies run as methods (REST parity:
      # DataPermissionsController POST, DELETE {permissionId}, POST {permissionId}/policies; UserManagement). No
      # replacesGenericCreate (row M16, and the Bootstrap blueprint seeds data permissions).
      - methodId: CreateDataPermission-1
        kind: Static
        description: "Creates a data permission. The result is the rtId of the new permission."
        parameters:
          - { name: permissionId, valueType: String, description: "The dot-namespaced permission id, unique per tenant." }
          - { name: description, valueType: String, isOptional: true }
        result:
          valueType: String
        errors:
          - { code: DATA_PERMISSION_ALREADY_EXISTS, description: "A permission with this id exists." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: DeleteDataPermission-1
        description: "Deletes the permission together with its policies (a policy without a permission would still protect its targets)."
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: CreatePolicy-1
        description: "Creates a policy that binds this permission to CK types. The result is the rtId of the new policy."
        parameters:
          - { name: targetCkTypeIds, valueType: StringArray, description: "The CK types the policy protects; not empty." }
          - { name: actions, valueType: StringArray, isOptional: true, description: "The actions the policy grants; omitted is none." }
          - { name: scope, valueType: Enum, valueCkEnumId: "${this}/DataPolicyScope" }
          - { name: enforcementMode, valueType: Enum, valueCkEnumId: "${this}/DataPolicyEnforcementMode" }
        result:
          valueType: String
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
