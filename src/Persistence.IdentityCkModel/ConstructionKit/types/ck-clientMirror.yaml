"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: ClientMirror
    derivable: Any
    description: "Tracks a ClientCredentials client that the parent tenant has auto-provisioned into a child tenant. Lives in the parent tenant's database. One row per (parentClientId × childTenantId) pair."
    derivedFromCkTypeId: ${System}/Entity
    writeAccess:
      channels: [ System.Identity/IdentityService ]
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/ClientId
        name: ParentClientId
      - id: ${this}/ParentTenantId
        name: ParentTenantId
      - id: ${this}/ChildTenantId
        name: ChildTenantId
      - id: ${this}/ProvisionedAt
        name: ProvisionedAt
      - id: ${this}/SecretHashVersion
        name: SecretHashVersion
      # 3.9.0 (AB#9923): the role assignments identity manages on this mirror (Client.MirrorRoleNames of the original).
      - id: ${this}/ManagedRoleNames
        name: ManagedRoleNames
        isOptional: true
      - id: ${this}/DeclinedRoleNames
        name: DeclinedRoleNames
        isOptional: true
      - id: ${this}/ManagedMirrorRtId
        name: ManagedMirrorRtId
        isOptional: true
    indexes:
      - indexType: Unique
        fields:
          - attributePaths:
              - ParentClientId
              - ChildTenantId
      - indexType: Ascending
        fields:
          - attributePaths:
              - ChildTenantId
