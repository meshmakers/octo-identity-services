"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Client
    derivable: Any
    derivedFromCkTypeId: ${System}/Entity
    isFinal: true
    isAbstract: false
    attributes:
      # AB#6329 (audit finding F5): what a tenant administrator decides about a seeded client -
      # disabling it, narrowing its scopes and grant types, opting it out of child-tenant
      # provisioning - is tenant-owned. As seed-owned, every System.Identity.Bootstrap update
      # re-enabled the client and widened its access again. Assignment overrides (System/Enabled is
      # shared by many types, so the System definition stays as it is). A fresh tenant still gets the
      # seed values; a blueprint can no longer CHANGE these on an existing client - a blueprint
      # author who must change a client's scopes or grants needs a CK migration step or a documented
      # manual step. Same pattern as Pipeline.Enabled (AB#5309).
      - id: ${System}/Enabled
        name: Enabled
        ownership: TenantOwned

      - id: ${this}/ClientId
        name: ClientId

      - id: ${this}/ProtocolType
        name: ProtocolType

      # AB#6329: a credential (secret hashes), so `Secret` rather than TenantOwned: kept on a
      # re-apply like TenantOwned, but left out of ExportRt. The attribute is shared with ApiResource,
      # hence an assignment override.
      - id: ${this}/Secrets
        name: ClientSecrets
        ownership: Secret

      - id: ${this}/RequireClientSecret
        name: RequireClientSecret

      - id: ${System}/Name
        name: ClientName
        isOptional: true

      - id: ${System}/Description
        name: Description
        isOptional: true

      - id: ${this}/ClientUri
        name: ClientUri
        isOptional: true

      - id: ${this}/LogoUri
        name: LogoUri
        isOptional: true

      - id: ${this}/RequireConsent
        name: RequireConsent
        isOptional: true

      - id: ${this}/AllowRememberConsent
        name: AllowRememberConsent

      - id: ${this}/AllowedGrantTypes
        name: AllowedGrantTypes
        ownership: TenantOwned

      - id: ${this}/RequirePkce
        name: RequirePkce

      - id: ${this}/AllowPlainTextPkce
        name: AllowPlainTextPkce

      - id: ${this}/RequireRequestObject
        name: RequireRequestObject

      - id: ${this}/AllowAccessTokensViaBrowser
        name: AllowAccessTokensViaBrowser

      - id: ${this}/RequireDPoP
        name: RequireDPoP

      - id: ${this}/DPoPValidationMode
        name: DPoPValidationMode

      - id: ${this}/DPoPClockSkew
        name: DPoPClockSkew
      - id: ${this}/RedirectUris
        name: RedirectUris

      - id: ${this}/PostLogoutRedirectUris
        name: PostLogoutRedirectUris
      - id: ${this}/FrontChannelLogoutUri
        name: FrontChannelLogoutUri
        isOptional: true
      - id: ${this}/FrontChannelLogoutSessionRequired
        name: FrontChannelLogoutSessionRequired
      - id: ${this}/BackChannelLogoutUri
        name: BackChannelLogoutUri
        isOptional: true
      - id: ${this}/BackChannelLogoutSessionRequired
        name: BackChannelLogoutSessionRequired
      - id: ${this}/AllowOfflineAccess
        name: AllowOfflineAccess
      - id: ${this}/AllowedScopes
        name: AllowedScopes
        ownership: TenantOwned
      - id: ${this}/AlwaysIncludeUserClaimsInIdToken
        name: AlwaysIncludeUserClaimsInIdToken
      - id: ${this}/IdentityTokenLifetime
        name: IdentityTokenLifetime
      - id: ${this}/AllowedIdentityTokenSigningAlgorithms
        name: AllowedIdentityTokenSigningAlgorithms
      - id: ${this}/AccessTokenLifetime
        name: AccessTokenLifetime
      - id: ${this}/AuthorizationCodeLifetime
        name: AuthorizationCodeLifetime
      - id: ${this}/AbsoluteRefreshTokenLifetime
        name: AbsoluteRefreshTokenLifetime
      - id: ${this}/SlidingRefreshTokenLifetime
        name: SlidingRefreshTokenLifetime
      - id: ${this}/ConsentLifetime
        name: ConsentLifetime
        isOptional: true
      - id: ${this}/UpdateAccessTokenClaimsOnRefresh
        name: UpdateAccessTokenClaimsOnRefresh
      - id: ${this}/RefreshTokenExpiration
        name: RefreshTokenExpiration
      - id: ${this}/AccessTokenType
        name: AccessTokenType
      - id: ${this}/EnableLocalLogin
        name: EnableLocalLogin
      - id: ${this}/IdentityProviderRestrictions
        name: IdentityProviderRestrictions
      - id: ${this}/IncludeJwtId
        name: IncludeJwtId
      - id: ${this}/ClientClaims
        name: ClientClaims
      - id: ${this}/AlwaysSendClientClaims
        name: AlwaysSendClientClaims
      - id: ${this}/ClientClaimsPrefix
        name: ClientClaimsPrefix
        isOptional: true
      - id: ${this}/PairWiseSubjectSalt
        name: PairWiseSubjectSalt
        isOptional: true
      - id: ${this}/UserSsoLifetime
        name: UserSsoLifetime
        isOptional: true
      - id: ${this}/UserCodeType
        name: UserCodeType
        isOptional: true
      - id: ${this}/DeviceCodeLifetime
        name: DeviceCodeLifetime
      - id: ${this}/CibaLifetime
        name: CibaLifetime
        isOptional: true
      - id: ${this}/PollingInterval
        name: PollingInterval
        isOptional: true
      - id: ${this}/CoordinateLifetimeWithUserSession
        name: CoordinateLifetimeWithUserSession
        isOptional: true
      - id: ${this}/AllowedCorsOrigins
        name: AllowedCorsOrigins
      - id: ${this}/InitiateLoginUri
        name: InitiateLoginUri
        isOptional: true

      - id: ${this}/AutoProvisionInChildTenants
        name: AutoProvisionInChildTenants
        ownership: TenantOwned

      - id: ${this}/ProvisionedByParentTenantId
        name: ProvisionedByParentTenantId
        isOptional: true

      - id: ${this}/DynamicRegistration
        name: DynamicRegistration
      - id: ${this}/DynamicRegistrationExpiresAt
        name: DynamicRegistrationExpiresAt
        isOptional: true
    associations:
      - id: ${this}/AssignedRole
        targetCkTypeId: ${this}/Role
      - id: ${this}/MayActAs
        targetCkTypeId: ${this}/Client
    # AB#7773 (Feature AB#5696, F4.2): the method declarations of the client; the handlers follow with AB#7780.
    # Declarations only: until a handler is registered the gateway answers METHOD_HANDLER_NOT_AVAILABLE.
    # Roles follow the REST parity (ApiSecretsController: IdentityTenantAdministrationWritePolicy = TenantManagement or UserManagement).
    # No replacesGenericCreate: the System.Identity.Bootstrap blueprint seeds clients (AB#7121 would refuse the tenant setup).
    methods:
      - methodId: AddSecret-1
        description: "Generates a new secret for the client. The generated value is the result and is shown exactly once; only its hash is stored."
        parameters:
          - { name: description, valueType: String, isOptional: true, description: "Free text shown in the list of secrets." }
          - { name: expirationDate, valueType: DateTime, isOptional: true, description: "Expiration of the secret; without it the secret does not expire." }
        result:
          valueType: String
          sensitive: true
        errors:
          - { code: CLIENT_SECRET_NOT_REQUIRED, description: "The client does not use a secret (RequireClientSecret is false)." }
        authorization:
          roles: [ TenantManagement, UserManagement ]
          dataAccess: Write
      - methodId: RemoveSecret-1
        description: "Removes a secret of the client, identified by its value (the REST parity: DELETE apiSecrets/client/{clientId}/{secretValue})."
        parameters:
          - { name: secretValue, valueType: String, sensitive: true, description: "The secret value that is removed." }
        errors:
          - { code: SECRET_NOT_FOUND, description: "The client has no secret with this value." }
        authorization:
          roles: [ TenantManagement, UserManagement ]
          dataAccess: Write
