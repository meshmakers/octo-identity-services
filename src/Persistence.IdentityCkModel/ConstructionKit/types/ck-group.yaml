"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Group
    derivable: Any
    description: "A group that can be assigned roles. Users and other groups can be members."
    derivedFromCkTypeId: ${System}/Entity
    writeAccess:
      channels: [ System.Identity/IdentityService ]
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/GroupName
        name: GroupName
      - id: ${this}/NormalizedGroupName
        name: NormalizedGroupName
      - id: ${this}/GroupDescription
        name: GroupDescription
        isOptional: true
    associations:
      - id: ${this}/AssignedRole
        targetCkTypeId: ${this}/Role
      - id: ${this}/GroupMember
        targetCkTypeId: ${this}/User
      - id: ${this}/GroupMember
        targetCkTypeId: ${this}/ExternalTenantUserMapping
      - id: ${this}/GroupMember
        targetCkTypeId: ${this}/Client
      - id: ${this}/ChildGroup
        targetCkTypeId: ${this}/Group
    indexes:
      - indexType: Ascending
        fields:
          - attributePaths:
              - NormalizedGroupName
    # AB#7773 (Feature AB#5696, F4.2): the method declarations of the group; the handlers follow with AB#7779.
    # Declarations only: until a handler is registered the gateway answers METHOD_HANDLER_NOT_AVAILABLE.
    # Roles follow the REST parity (GroupsController: IdentityUserAdministrationWritePolicy = UserManagement).
    # No replacesGenericCreate: the System.Identity.Bootstrap blueprint seeds groups (AB#7121 would refuse the tenant setup).
    methods:
      - methodId: AddMember-1
        description: "Adds a user or a client to the group."
        parameters:
          - { name: memberKind, valueType: Enum, valueCkEnumId: "${this}/GroupMemberKind" }
          - { name: memberId, valueType: String, description: "The rtId of the user, or the client id of the client." }
        errors:
          - { code: MEMBER_NOT_FOUND, description: "The user or client does not exist." }
          - { code: MEMBER_ALREADY_IN_GROUP, description: "The member already belongs to the group." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: RemoveMember-1
        description: "Removes a user or a client from the group."
        parameters:
          - { name: memberKind, valueType: Enum, valueCkEnumId: "${this}/GroupMemberKind" }
          - { name: memberId, valueType: String, description: "The rtId of the user, or the client id of the client." }
        errors:
          - { code: MEMBER_NOT_FOUND, description: "The user or client does not exist." }
          - { code: MEMBER_NOT_IN_GROUP, description: "The member does not belong to the group." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: SetRoles-1
        description: "Replaces the roles of the group by the given role names."
        parameters:
          - { name: roleNames, valueType: StringArray, description: "The complete list of role names." }
        errors:
          - { code: ROLE_NOT_FOUND, description: "A role name does not exist." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      # 3.3.0: nested groups (ChildGroup). Own methods instead of a third GroupMemberKind value, because the cycle refusal
      # needs its own error code and an error code added to AddMember-1 would be a Major (row M8). REST parity:
      # PUT/DELETE groups/{group}/members/groups/{child} (IdentityUserAdministrationWritePolicy = UserManagement).
      - methodId: AddChildGroup-1
        description: "Adds a group as a nested member (child group) of the group. Refuses a group in itself and a cycle."
        parameters:
          - { name: childGroupId, valueType: String, description: "The rtId of the child group." }
        errors:
          - { code: CHILD_GROUP_NOT_FOUND, description: "The child group does not exist." }
          - { code: CHILD_GROUP_ALREADY_IN_GROUP, description: "The child group is already a member of the group." }
          - { code: GROUP_CYCLE, description: "The group would become a member of itself, directly or through its child groups." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
        execution:
          timeoutSeconds: 30
          idempotent: false
      - methodId: RemoveChildGroup-1
        description: "Removes a nested member (child group) from the group."
        parameters:
          - { name: childGroupId, valueType: String, description: "The rtId of the child group." }
        errors:
          - { code: CHILD_GROUP_NOT_FOUND, description: "The child group id is not a valid id, or the caller may not read that group." }
          - { code: CHILD_GROUP_NOT_IN_GROUP, description: "The child group is not a member of the group." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
        execution:
          timeoutSeconds: 30
          idempotent: false
      # 3.7.0: create, update and delete run as methods (REST parity: GroupsController POST/PUT/DELETE,
      # IdentityUserAdministrationWritePolicy = UserManagement). NormalizedGroupName is derived by the handler. The initial roles of
      # CreateGroup pass the role change guard like SetRoles. No replacesGenericCreate (Major on this type, row M16; the generic
      # create is refused by writeAccess since 3.6.0, the Bootstrap blueprint seeds through the system path).
      - methodId: CreateGroup-1
        kind: Static
        description: "Creates a group, optionally with initial roles. The result is the rtId of the new group."
        parameters:
          - { name: groupName, valueType: String }
          - { name: groupDescription, valueType: String, isOptional: true }
          - { name: roleNames, valueType: StringArray, isOptional: true, description: "Initial roles by name." }
        result:
          valueType: String
        errors:
          - { code: GROUP_ALREADY_EXISTS, description: "A group with this name exists." }
          - { code: ROLE_NOT_FOUND, description: "A role name does not exist." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: UpdateGroup-1
        description: "Replaces the name and the description of the group (an omitted description is cleared)."
        parameters:
          - { name: groupName, valueType: String }
          - { name: groupDescription, valueType: String, isOptional: true }
        errors:
          - { code: GROUP_ALREADY_EXISTS, description: "Another group has this name." }
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
      - methodId: DeleteGroup-1
        description: "Deletes the group. Refused when it would remove the last user administrator (METHOD_FORBIDDEN)."
        authorization:
          roles: [ UserManagement ]
          dataAccess: Write
