"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: OAuthAuthorization
    description: "OpenIddict authorization (AB#4989/AB#4991): the durable link between a subject, a client and the granted scopes - permanent authorizations represent remembered consent, ad-hoc authorizations tie the tokens of one flow together. Replaces the consent/authorization role of PersistedGrant after the Duende -> OpenIddict cutover."
    derivedFromCkTypeId: ${System}/Entity
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/SubjectId
        name: SubjectId
        isOptional: true
      - id: ${this}/ClientId
        name: ClientId
      - id: ${this}/AuthorizationType
        name: AuthorizationType
        isOptional: true
      - id: ${this}/Status
        name: Status
        isOptional: true
      - id: ${this}/Scopes
        name: Scopes
      - id: ${this}/Properties
        name: Properties
        isOptional: true
      - id: ${this}/CreationDateTime
        name: CreationDateTime
        isOptional: true
    indexes:
      - indexType: Ascending
        fields:
          - attributePaths:
              - SubjectId
      - indexType: Ascending
        fields:
          - attributePaths:
              - ClientId
      - indexType: Ascending
        fields:
          - attributePaths:
              - CreationDateTime
