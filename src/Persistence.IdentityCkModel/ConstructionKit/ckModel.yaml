"$schema": "https://schemas.meshmakers.cloud/construction-kit-meta.schema.json"
# 2.29.0 (AB#7773, Feature AB#5696) declares the identity methods of User, Group, Client and DataPermission - declarations only,
# the handlers follow with AB#5672 (ChangePassword and the method host in identity), AB#7774, AB#7776-AB#7780:
#   * User:           ChangePassword (allowSelf), ResetPassword, SetRoles, AddRole, RemoveRole, Merge, and the static CreateUser
#                     (Create is a reserved method name, compiler error 102). CreateUser does NOT set `replacesGenericCreate`
#                     yet: on the existing type User the flag is a MAJOR change (row M16), see the comment at the method.
#   * Group:          AddMember, RemoveMember (user or client; new enum GroupMemberKind), SetRoles.
#   * Client:         AddSecret (the result is `sensitive`: the generated secret is shown once), RemoveSecret.
#   * DataPermission: GrantToRole, RevokeFromRole.
# Password and secret parameters are `sensitive`; roles follow the REST parity (UserManagement, clients also TenantManagement);
# every method declares authorization.dataAccess Write (AB#7036). Group, Client and DataPermission
# do NOT replace the generic create either: the System.Identity.Bootstrap blueprint seeds them (AB#7121 would refuse every new tenant).
# Adding methods and an enum is additive: Minor, nothing to acknowledge. A declared method without a handler answers
# METHOD_HANDLER_NOT_AVAILABLE; release the identity service with this model only when the handler stories are merged.
#
# 2.28.0 (AB#7772, Feature AB#5696, closes accepted risk R13) is the FIRST ckLanguage 2 release of
# System.Identity. It closes R13 - password hashes and security fields readable through the generic
# GraphQL path - with the CK v2 access modifiers of the RtUser assignments:
#   * Hidden:     PasswordHash, SecurityStamp, UserTokens (TOTP key and recovery codes) - never in GraphQL
#                 output or input; ConcurrencyStamp does not exist in this model, so there is nothing to drop.
#   * ReadOnly:   AccessFailedCount, LockoutEnd - readable, written only by the identity service.
#   * MethodOnly: UserName, Email - readable, changed only by a type method (identity writes them through
#                 its own repository, which the access modifiers do not guard).
# All seven attribute definitions are `securitySensitive: true`, so the tightening is Minor + acknowledge
# (it carried compatibility.acknowledge entries for the one release that published 2.28.0, removed afterwards because an acknowledgement is valid for one release only, OCTO-CK204; row T7a of docs/ck-semver-rules.md in octo-construction-kit-engine:
# the one release that moves a classic model to ckLanguage 2, once per model). The next release follows
# the normal rule (row T7) again.
# Every existing type and record declares `derivable: Any` (the classic behaviour), because the ckLanguage 2
# default is Model and the flip would be a Major of its own. Ids, types, defaults and ownership are unchanged;
# System.Identity stays on 2.x. Behaviour change: ImportRt, blueprint seeds and migrations refuse a value for
# a Hidden or MethodOnly attribute (OCTO-CK139), and an ExportRt never carries a Hidden value.
#
# 2.27.0 (AB#7766, audit finding H3) keeps the credential material of a user out of an ExportRt (export as
# template, tenant clone): RtUser.PasswordHash, RtUser.SecurityStamp and RtUser.UserTokens (TOTP key and
# recovery codes) are `ownership: Secret` (definition level; they are assigned by User only), and so is the
# UserToken.Value member (assignment override). The engine skips Secret attributes in the export and keeps
# them on an Upsert, so a blueprint re-apply never touches an existing user's hash or stamp. SeedOwned ->
# Secret is an ownership change: CkSemVerClassifier rates it Minor; ids, types and defaults are unchanged
# (still ckLanguage 1; the access modifiers follow with AB#7772). Behaviour change: a tenant cloned with
# ExportRt/ImportRt carries its users without password and 2FA material - they reset the password in the
# target tenant. (2.26.0 is the preceding version of this model.)
#
# 2.24.0 (AB#6384) adds the optional Boolean DataPolicy.ProtectBlueprintLocked (default false): the opt-in
# of the engine write guard that makes blueprint-locked entities read-only for non-system callers. It is
# SEED-OWNED (the blueprint author decides which types are protected; every blueprint update re-applies it),
# the opposite of PolicyEnforcementMode / PolicyScope. Additive (rule T1), no migration entry; an engine or
# tenant without the attribute reads it as false.
#
# 2.24.0 also (AB#6443, audit AB#6317 re-scan): ApiResource.Secrets is `ownership: Secret` (assignment
# override, like Client.Secrets in 2.23.0). The Identity.Bootstrap seed writes it (empty) on the seeded API
# resources, so it was seed-owned in effect; now a tenant-set introspection secret is kept on a re-apply
# and left out of an ExportRt. Rated Minor (ownership change); ids, types and defaults unchanged.
#
# 2.23.0 (AB#6324, AB#6329; audit AB#6317 findings F2 and F5) makes what a tenant administrator
# decides in the product tenant-owned, so a blueprint update or re-apply no longer reverts it:
#   * DataPolicy.PolicyEnforcementMode and PolicyScope: TenantOwned. The seeds ship AuditOnly and an
#     update silently turned a tenant that had switched to Enforce back to AuditOnly.
#   * Client: System/Enabled, AllowedGrantTypes, AllowedScopes, AutoProvisionInChildTenants are
#     TenantOwned assignment overrides; Secrets is `ownership: Secret` (kept, not exported).
#   * Resource (so ApiResource, ApiScope, IdentityResource): System/Enabled TenantOwned.
# Attribute ids, types and defaults are unchanged; CkSemVerClassifier rates an ownership change Minor.
# Consequence for blueprint authors: a seed initialises these values on a new entity but can no
# longer change them on an existing one - use a CK migration step or a documented manual step.
#
# 2.19.0 marks the client URI attributes (ClientUri, RedirectUris,
# PostLogoutRedirectUris, AllowedCorsOrigins) as isRuntimeState (AB#5210).
#
# Why: the productive redirect URI is the deployment's public hostname. That
# hostname is already isRuntimeState (AB#4706) precisely because no seed can
# derive it - ${octo.domain} is the PLATFORM domain while apps are served from
# their own. Leaving the URIs seed-owned meant every blueprint re-apply reset
# them to a host that does not resolve; on prod-1 that took sign-in down for six
# accounting tenants on 2026-09-15 ("invalid redirect_uri", OpenIddict ID2043).
# The two attributes describe one fact and must share one owner.
#
# CkSemVerClassifier rates an isRuntimeState change Minor (blueprint re-apply
# behaviour changes), hence the minor bump.
#
# 2.25.0 (AB#5540) turns the identity-provider ClientSecret (Google, Microsoft, Facebook,
# Azure Entra ID) into the Secret value type with Secret ownership (AB#5540,
# concept AB#5528 in octo-construction-kit-engine). String -> Secret is Minor
# (CkSemVerClassifier): stored clear-text values stay readable as legacy values
# until the encrypt sweep has run. Secret requires System >= 2.5 (decision 12).
modelId: System.Identity-2.29.0
ckLanguage: 2
dependencies:
  - System-[2.5,3.0)
