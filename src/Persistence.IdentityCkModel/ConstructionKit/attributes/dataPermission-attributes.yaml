"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  - id: TargetCkTypeIds
    valueType: StringArray
    defaultValues: [ ]
    description: CK type ids or collection roots the policy protects; derived types inherit the policy.

  - id: PolicyActions
    valueType: StringArray
    defaultValues: [ ]
    description: "Granted actions: Read, Write, Delete."

  # AB#6324 (audit finding F2): PolicyScope is tenant-owned for the same reason as
  # PolicyEnforcementMode below. A tenant that narrowed a policy to OwnedOnly must not be widened
  # back to All by a blueprint update: that is a silent access widening, i.e. a security regression.
  # Same consequence: a blueprint can no longer CHANGE the scope of an existing policy.
  - id: PolicyScope
    valueType: Enum
    valueCkEnumId: ${this}/DataPolicyScope
    ownership: TenantOwned
    defaultValues:
      - 0
    description: All grants access to every entity of the target types; OwnedOnly restricts to entities created by the caller (RtCreatedBy). Owned by the tenant - a blueprint update or re-apply keeps the stored value and only initialises a new policy.

  # AB#6324 (audit finding F2): the seeds of System.Identity.Bootstrap and MeshmakersAccounting ship
  # every DataPolicy as AuditOnly ("flip to Enforce per tenant"). The tenant administrator makes that
  # flip in the product. While the attribute was seed-owned, every blueprint update (an Upsert is a
  # full ReplaceOne) put the seed's AuditOnly back: authorization silently stopped being enforced.
  # TenantOwned, not Secret/RuntimeState: it is not a credential, and it is part of the tenant's
  # portable definition, so an ExportRt carries it. A fresh tenant still gets the seed value
  # (AuditOnly); a blueprint can no longer CHANGE the mode of an existing policy - a blueprint
  # author who must tighten a policy needs a CK migration step or a documented manual step.
  - id: PolicyEnforcementMode
    valueType: Enum
    valueCkEnumId: ${this}/DataPolicyEnforcementMode
    ownership: TenantOwned
    defaultValues:
      - 0
    description: Enforce applies the policy; AuditOnly only logs violations without filtering or rejecting (migration mode). Owned by the tenant - a blueprint update or re-apply keeps the stored value (a tenant that switched to Enforce stays on Enforce) and only initialises a new policy.

  # AB#6384: opt-in switch of the engine's blueprint-lock restriction (DataPermissionWriteGuard).
  # SEED-OWNED, the opposite of PolicyEnforcementMode above: the blueprint author decides which
  # CK types are protected, and every blueprint update / forced re-apply puts the product's value
  # back. A tenant administrator therefore cannot switch the protection off for good (and a
  # blueprint can tighten or loosen it later). Default false and an absent value read as false, so
  # existing policies and tenants are unaffected. The policy's own PolicyEnforcementMode (tenant-owned)
  # still decides whether a violation is refused (Enforce) or only audited (AuditOnly).
  - id: ProtectBlueprintLocked
    valueType: Boolean
    ownership: SeedOwned
    defaultValues:
      - false
    description: Opt-in restriction (not a grant). When true, non-system callers cannot update or delete entities of the target types whose RtBlueprintLocked is true, nor set or change RtBlueprintLocked, RtBlueprintSource and RtBlueprintAppliedAt on them (refused with message 6384; AuditOnly policies only audit). Blueprint-owned - set by the blueprint seed, re-applied on every blueprint update. Default false.
