<div class="lcars-auth-container">
  <app-lcars-panel>
    <app-lcars-header
      [subtitle]="'SETUP.SUBTITLE' | translate"
      [showUserMenu]="false">
    </app-lcars-header>

    <!-- Loading State -->
    <div *ngIf="loading" class="lcars-loading">
      <div class="lcars-loading__spinner"></div>
      <span class="lcars-loading__text">{{ 'SETUP.CHECKING' | translate }}</span>
    </div>

    <!-- Success State -->
    <div *ngIf="success" class="success-message">
      <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h3>{{ 'SETUP.SUCCESS_TITLE' | translate }}</h3>
      <p>{{ 'SETUP.SUCCESS_TEXT' | translate }}</p>
      <a [routerLink]="['/', tenantId, 'login']" class="lcars-button lcars-button--primary">
        {{ 'COMMON.SIGN_IN' | translate }}
      </a>
    </div>

    <!-- Setup Form -->
    <ng-container *ngIf="!loading && !success">
      <div class="setup-intro">
        <p>{{ 'SETUP.INTRO' | translate }}</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="lcars-error-message">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #setupForm="ngForm">
        <div class="lcars-form-group">
          <label for="email">{{ 'SETUP.EMAIL' | translate }}</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            autocomplete="email"
            [disabled]="submitting"
            [placeholder]="'SETUP.EMAIL_PLACEHOLDER' | translate" />
        </div>

        <div class="lcars-form-group">
          <label for="password">{{ 'COMMON.PASSWORD' | translate }}</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="new-password"
            [disabled]="submitting"
            [placeholder]="'SETUP.PASSWORD_PLACEHOLDER' | translate" />
        </div>

        <div class="lcars-form-group">
          <label for="confirmPassword">{{ 'SETUP.CONFIRM_PASSWORD' | translate }}</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            autocomplete="new-password"
            [disabled]="submitting"
            [placeholder]="'SETUP.CONFIRM_PASSWORD_PLACEHOLDER' | translate" />
        </div>

        <div *ngIf="passwordMismatch" class="field-error">
          {{ 'COMMON.PASSWORDS_MISMATCH' | translate }}
        </div>

        <div class="lcars-actions lcars-actions--stacked">
          <button
            type="submit"
            class="lcars-button-primary"
            [disabled]="submitting || !email || !password || !confirmPassword || passwordMismatch">
            <span *ngIf="!submitting">{{ 'SETUP.CREATE' | translate }}</span>
            <span *ngIf="submitting">{{ 'SETUP.CREATING' | translate }}</span>
          </button>
        </div>
      </form>
    </ng-container>
  </app-lcars-panel>
</div>
